upstream frontend {
    server frontend:3000;
}

upstream api {
    server api-service:3001;
}

upstream media {
    server media-service:3002;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Client body size (for file uploads)
    client_max_body_size 50M;

    # ---- MEDIA SERVICE ROUTES (must be before general /api/v1/) ----

    # Media uploads API
    location /api/v1/upload/ {
        limit_req zone=upload_limit burst=10 nodelay;

        proxy_pass http://media/api/v1/upload/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Media gallery API
    location /api/v1/media/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://media/api/v1/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static uploaded files (served by media service)
    location /uploads/ {
        proxy_pass http://media/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Cache static media files
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- API SERVICE ROUTES (general catch-all for /api/v1/) ----

    # API Service - proxy to backend
    location /api/v1/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check endpoints
    location /health/api {
        proxy_pass http://api/health;
        proxy_http_version 1.1;
    }

    location /health/media {
        proxy_pass http://media/health;
        proxy_http_version 1.1;
    }

    # Frontend - Next.js (catch-all, must be last)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache Next.js static assets
    location /_next/static/ {
        proxy_pass http://frontend/_next/static/;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
